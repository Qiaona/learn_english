<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小詞彙樂園 - Gemini 3 Pro</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #FFF9E3;
            font-family: 'Comic Sans MS', 'Microsoft JhengHei', sans-serif;
            overflow: hidden;
        }

        #app-container {
            width: 90%;
            max-width: 450px;
            height: 750px;
            background: white;
            border-radius: 40px;
            border: 8px solid #FFD166;
            box-shadow: 0 20px 0 #FEE4A0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 10px;
            position: relative;
        }

        #category-tag { background-color: #FEF08A; color: #CA8A04; padding: 5px 15px; border-radius: 20px; font-weight: bold; margin-bottom: 10px; }

        /* 詞卡樣式 */
        #word-card {
            background-color: #E0F2FE;
            width: 85%;
            padding: 20px;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 10px 0 #BAE6FD;
            user-select: none;
            transition: transform 0.2s;
        }
        #word-card:active { transform: scale(0.98); }

        #word-emoji { font-size: 80px; }
        #word-text { font-size: 50px; color: #0369A1; font-weight: bold; margin: 5px 0; }
        #word-ipa { font-size: 22px; color: #64748B; margin-bottom: 5px; }
        #word-zh { font-size: 24px; color: #7DD3FC; font-weight: bold; }

        /* 例句區域 */
        #example-box { 
            height: 80px; 
            width: 85%;
            color: #475569; 
            font-size: 20px; 
            font-style: italic; 
            text-align: center; 
            background: #F1F5F9;
            padding: 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 按鈕樣式 */
        .btn-group { display: flex; gap: 15px; width: 85%; justify-content: center; margin-bottom: 20px; }
        .nav-btn { background-color: #FF80A0; color: white; border: none; padding: 15px 20px; font-size: 18px; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 0 #E56386; flex: 1; }
        .example-btn { background-color: #4ADE80; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 0 #22C55E; width: 85%; margin-bottom: 10px;}
        
        .nav-btn:active, .example-btn:active { transform: translateY(3px); }
    </style>
</head>
<body>

    <div id="app-container">
        <h2 style="color: #FF80A0; margin: 10px 0;">小詞彙樂園</h2>
        <div id="category-tag">Loading...</div>

        <div id="word-card" onclick="speakWord()">
            <div id="word-emoji">🍎</div>
            <div id="word-text">apple</div>
            <div id="word-ipa">/ˈæp.l̩/</div>
            <div id="word-zh">蘋果</div>
        </div>

        <div id="example-box">點擊綠色按鈕看例句</div>

        <button class="example-btn" onclick="speakExample()">🔊 聽例句</button>

        <div class="btn-group">
            <button class="nav-btn" onclick="prevWord()">⬅️ 上一個</button>
            <button class="nav-btn" onclick="nextWord()">下一個 ➡️</button>
        </div>
    </div>

    <script>
    const words = [
    // Numbers (數字)
    { en: "one", ipa: "/wʌn/", zh: "一", emoji: "1️⃣", example: "I have one apple.", category: "Numbers 數字" },
    { en: "two", ipa: "/tuː/", zh: "二", emoji: "2️⃣", example: "I have two eyes.", category: "Numbers 數字" },
    { en: "three", ipa: "/θriː/", zh: "三", emoji: "3️⃣", example: "I see three birds.", category: "Numbers 數字" },
    { en: "four", ipa: "/fɔː/", zh: "四", emoji: "4️⃣", example: "There are four chairs.", category: "Numbers 數字" },
    { en: "five", ipa: "/faɪv/", zh: "五", emoji: "5️⃣", example: "I have five pencils.", category: "Numbers 數字" },
    { en: "six", ipa: "/sɪks/", zh: "六", emoji: "6️⃣", example: "She is six years old.", category: "Numbers 數字" },
    { en: "seven", ipa: "/ˈsev.n̩/", zh: "七", emoji: "7️⃣", example: "I see seven stars.", category: "Numbers 數字" },
    { en: "eight", ipa: "/eɪt/", zh: "八", emoji: "8️⃣", example: "Eight pigs are fat.", category: "Numbers 數字" },
    { en: "nine", ipa: "/naɪn/", zh: "九", emoji: "9️⃣", example: "I have nine books.", category: "Numbers 數字" },
    { en: "ten", ipa: "/ten/", zh: "十", emoji: "🔟", example: "I have ten fingers.", category: "Numbers 數字" },

    // Colours (顏色)
    { en: "red", ipa: "/red/", zh: "紅色", emoji: "🔴", example: "The apple is red.", category: "Colours 顏色" },
    { en: "blue", ipa: "/bluː/", zh: "藍色", emoji: "🔵", example: "The sky is blue.", category: "Colours 顏色" },
    { en: "yellow", ipa: "/ˈjel.əʊ/", zh: "黃色", emoji: "🟡", example: "Look at the yellow sun.", category: "Colours 顏色" },
    { en: "green", ipa: "/ɡriːn/", zh: "綠色", emoji: "🟢", example: "The grass is green.", category: "Colours 顏色" },
    { en: "black", ipa: "/blæk/", zh: "黑色", emoji: "⚫", example: "I have a black pen.", category: "Colours 顏色" },
    { en: "white", ipa: "/waɪt/", zh: "白色", emoji: "⚪", example: "The cloud is white.", category: "Colours 顏色" },
    { en: "pink", ipa: "/pɪŋk/", zh: "粉紅色", emoji: "🌸", example: "I like my pink bag.", category: "Colours 顏色" },

    // School Things (學校用品)
    { en: "book", ipa: "/bʊk/", zh: "書本", emoji: "📖", example: "Read your book.", category: "School Things 學校用品" },
    { en: "pen", ipa: "/pen/", zh: "原子筆", emoji: "🖊️", example: "I use a pen to write.", category: "School Things 學校用品" },
    { en: "pencil", ipa: "/ˈpen.səl/", zh: "鉛筆", emoji: "✏️", example: "My pencil is short.", category: "School Things 學校用品" },
    { en: "ruler", ipa: "/ˈruː.lə/", zh: "間尺", emoji: "📏", example: "The ruler is long.", category: "School Things 學校用品" },
    { en: "rubber", ipa: "/ˈrʌb.ə/", zh: "橡皮擦", emoji: "🧽", example: "I have a small rubber.", category: "School Things 學校用品" },
    { en: "bag", ipa: "/bæɡ/", zh: "書包", emoji: "🎒", example: "My bag is heavy.", category: "School Things 學校用品" },
    { en: "desk", ipa: "/desk/", zh: "書桌", emoji: "🏫", example: "Put it on the desk.", category: "School Things 學校用品" },
    { en: "chair", ipa: "/tʃeə/", zh: "椅子", emoji: "🪑", example: "Sit on the chair.", category: "School Things 學校用品" },

    // Family (家庭成員)
    { en: "father", ipa: "/ˈfɑː.ðə/", zh: "爸爸", emoji: "👨", example: "He is my father.", category: "Family 家庭" },
    { en: "mother", ipa: "/ˈmʌð.ə/", zh: "媽媽", emoji: "👩", example: "She is my mother.", category: "Family 家庭" },
    { en: "brother", ipa: "/ˈbrʌð.ə/", zh: "兄弟", emoji: "👦", example: "I play with my brother.", category: "Family 家庭" },
    { en: "sister", ipa: "/ˈsɪs.tə/", zh: "姊妹", emoji: "👧", example: "My sister is cute.", category: "Family 家庭" },
    { en: "grandfather", ipa: "/ˈɡræn.fɑː.ðə/", zh: "祖父/外公", emoji: "👴", example: "My grandfather is kind.", category: "Family 家庭" },
    { en: "grandmother", ipa: "/ˈɡræn.mʌð.ə/", zh: "祖母/外婆", emoji: "👵", example: "I love my grandmother.", category: "Family 家庭" },

    // Body Parts (身體部位)
    { en: "head", ipa: "/hed/", zh: "頭", emoji: "👦", example: "Touch your head.", category: "Body Parts 身體部位" },
    { en: "eye", ipa: "/aɪ/", zh: "眼睛", emoji: "👁️", example: "I have two eyes.", category: "Body Parts 身體部位" },
    { en: "ear", ipa: "/ɪə/", zh: "耳朵", emoji: "👂", example: "I listen with my ears.", category: "Body Parts 身體部位" },
    { en: "nose", ipa: "/nəʊz/", zh: "鼻子", emoji: "👃", example: "This is my nose.", category: "Body Parts 身體部位" },
    { en: "mouth", ipa: "/maʊθ/", zh: "嘴巴", emoji: "👄", example: "Open your mouth.", category: "Body Parts 身體部位" },
    { en: "hand", ipa: "/hænd/", zh: "手", emoji: "✋", example: "Wash your hands.", category: "Body Parts 身體部位" },
    { en: "leg", ipa: "/leɡ/", zh: "腿", emoji: "🦵", example: "He has long legs.", category: "Body Parts 身體部位" },

    // Animals/Pets (動物)
    { en: "cat", ipa: "/kæt/", zh: "貓", emoji: "🐱", example: "The cat is sleeping.", category: "Animals 動物" },
    { en: "dog", ipa: "/dɒɡ/", zh: "狗", emoji: "🐶", example: "The dog is barking.", category: "Animals 動物" },
    { en: "bird", ipa: "/bɜːd/", zh: "鳥", emoji: "🐦", example: "The bird can fly.", category: "Animals 動物" },
    { en: "fish", ipa: "/fɪʃ/", zh: "魚", emoji: "🐟", category: "Animals 動物" },
    { en: "rabbit", ipa: "/ˈræb.ɪt/", zh: "兔子", emoji: "🐰", example: "The rabbit likes carrots.", category: "Animals 動物" },
    { en: "turtle", ipa: "/ˈtɜː.tl̩/", zh: "烏龜", emoji: "🐢", example: "The turtle is slow.", category: "Animals 動物" },

    // Food & Drinks (食物與飲品)
    { en: "apple", ipa: "/ˈæp.l̩/", zh: "蘋果", emoji: "🍎", example: "I eat an apple.", category: "Food 食物" },
    { en: "banana", ipa: "/bəˈnɑː.nə/", zh: "香蕉", emoji: "🍌", example: "The banana is yellow.", category: "Food 食物" },
    { en: "orange", ipa: "/ˈɒr.ɪndʒ/", zh: "橙", emoji: "🍊", example: "I like orange juice.", category: "Food 食物" },
    { en: "milk", ipa: "/mɪlk/", zh: "牛奶", emoji: "🥛", example: "Drink your milk.", category: "Food 食物" },
    { en: "water", ipa: "/ˈwɔː.tə/", zh: "水", emoji: "💧", example: "I drink water every day.", category: "Food 食物" },
    { en: "cake", ipa: "/keɪk/", zh: "蛋糕", emoji: "🍰", example: "Happy Birthday! Have some cake.", category: "Food 食物" }
];


    
        let currentIndex = 0;

        function updateDisplay() {
            const w = words[currentIndex];
            document.getElementById('word-text').innerText = w.en;
            document.getElementById('word-ipa').innerText = w.ipa;
            document.getElementById('word-emoji').innerText = w.emoji;
            document.getElementById('word-zh').innerText = w.zh;
            document.getElementById('category-tag').innerText = w.category;
            // 每次切換單詞，重置例句顯示框
            document.getElementById('example-box').innerText = "點擊綠色按鈕看例句";
            speakWord();
        }

        // 發音功能（英式發音）
        function speak(text) {
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'en-GB';
            window.speechSynthesis.speak(msg);
        }

        function speakWord() { speak(words[currentIndex].en); }

        function speakExample() {
            const example = words[currentIndex].example;
            document.getElementById('example-box').innerText = example;
            speak(example);
        }

        function nextWord() {
            currentIndex = (currentIndex + 1) % words.length;
            updateDisplay();
        }

        function prevWord() {
            currentIndex = (currentIndex - 1 + words.length) % words.length;
            updateDisplay();
        }

        window.onload = updateDisplay;
    </script>
</body>
</html>
