<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小詞彙樂園 - Gemini 3 Pro</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #FFF9E3;
            font-family: 'Comic Sans MS', 'Microsoft JhengHei', sans-serif;
            overflow: hidden;
        }

        #app-container {
            width: 90%;
            max-width: 450px;
            height: 750px;
            background: white;
            border-radius: 40px;
            border: 8px solid #FFD166;
            box-shadow: 0 20px 0 #FEE4A0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 10px;
            position: relative;
        }

        #category-tag { background-color: #FEF08A; color: #CA8A04; padding: 5px 15px; border-radius: 20px; font-weight: bold; margin-bottom: 10px; }

        /* 詞卡樣式 */
        #word-card {
            background-color: #E0F2FE;
            width: 85%;
            padding: 20px;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 10px 0 #BAE6FD;
            user-select: none;
            transition: transform 0.2s;
        }
        #word-card:active { transform: scale(0.98); }

        #word-emoji { font-size: 80px; }
        #word-text { font-size: 50px; color: #0369A1; font-weight: bold; margin: 5px 0; }
        #word-ipa { font-size: 22px; color: #64748B; margin-bottom: 5px; }
        #word-zh { font-size: 24px; color: #7DD3FC; font-weight: bold; }

        /* 例句區域 */
        #example-box { 
            height: 80px; 
            width: 85%;
            color: #475569; 
            font-size: 20px; 
            font-style: italic; 
            text-align: center; 
            background: #F1F5F9;
            padding: 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 按鈕樣式 */
        .btn-group { display: flex; gap: 15px; width: 85%; justify-content: center; margin-bottom: 20px; }
        .nav-btn { background-color: #FF80A0; color: white; border: none; padding: 15px 20px; font-size: 18px; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 0 #E56386; flex: 1; }
        .example-btn { background-color: #4ADE80; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 0 #22C55E; width: 85%; margin-bottom: 10px;}
        
        .nav-btn:active, .example-btn:active { transform: translateY(3px); }
    </style>
</head>
<body>

    <div id="app-container">
        <h2 style="color: #FF80A0; margin: 10px 0;">小詞彙樂園</h2>
        <div id="category-tag">Loading...</div>

        <div id="word-card" onclick="speakWord()">
            <div id="word-emoji">🍎</div>
            <div id="word-text">apple</div>
            <div id="word-ipa">/ˈæp.l̩/</div>
            <div id="word-zh">蘋果</div>
        </div>

        <div id="example-box">點擊綠色按鈕看例句</div>

        <button class="example-btn" onclick="speakExample()">🔊 聽例句</button>

        <div class="btn-group">
            <button class="nav-btn" onclick="prevWord()">⬅️ 上一個</button>
            <button class="nav-btn" onclick="nextWord()">下一個 ➡️</button>
        </div>
    </div>

    <script>
        const words = [
            // Numbers (數字)
            { en: "one", zh: "一", emoji: "1️⃣", category: "Numbers 數字" },
            { en: "two", zh: "二", emoji: "2️⃣", category: "Numbers 數字" },
            { en: "three", zh: "三", emoji: "3️⃣", category: "Numbers 數字" },
            { en: "four", zh: "四", emoji: "4️⃣", category: "Numbers 數字" },
            { en: "five", zh: "五", emoji: "5️⃣", category: "Numbers 數字" },
            { en: "six", zh: "六", emoji: "6️⃣", category: "Numbers 數字" },
            { en: "seven", zh: "七", emoji: "7️⃣", category: "Numbers 數字" },
            { en: "eight", zh: "八", emoji: "8️⃣", category: "Numbers 數字" },
            { en: "nine", zh: "九", emoji: "9️⃣", category: "Numbers 數字" },
            { en: "ten", zh: "十", emoji: "🔟", category: "Numbers 數字" },

            // Colours (顏色)
            { en: "red", zh: "紅色", emoji: "🔴", category: "Colours 顏色" },
            { en: "blue", zh: "藍色", emoji: "🔵", category: "Colours 顏色" },
            { en: "yellow", zh: "黃色", emoji: "🟡", category: "Colours 顏色" },
            { en: "green", zh: "綠色", emoji: "🟢", category: "Colours 顏色" },
            { en: "black", zh: "黑色", emoji: "⚫", category: "Colours 顏色" },
            { en: "white", zh: "白色", emoji: "⚪", category: "Colours 顏色" },
            { en: "pink", zh: "粉紅色", emoji: "🌸", category: "Colours 顏色" },

            // School Things (學校用品)
            { en: "book", zh: "書本", emoji: "📖", category: "School Things 學校用品" },
            { en: "pen", zh: "原子筆", emoji: "🖊️", category: "School Things 學校用品" },
            { en: "pencil", zh: "鉛筆", emoji: "✏️", category: "School Things 學校用品" },
            { en: "ruler", zh: "間尺", emoji: "📏", category: "School Things 學校用品" },
            { en: "rubber", zh: "橡皮擦", emoji: "🧽", category: "School Things 學校用品" },
            { en: "bag", zh: "書包", emoji: "🎒", category: "School Things 學校用品" },
            { en: "desk", zh: "書桌", emoji: "🏫", category: "School Things 學校用品" },
            { en: "chair", zh: "椅子", emoji: "🪑", category: "School Things 學校用品" },

            // Family (家庭成員)
            { en: "father", zh: "爸爸", emoji: "👨", category: "Family 家庭" },
            { en: "mother", zh: "媽媽", emoji: "👩", category: "Family 家庭" },
            { en: "brother", zh: "兄弟", emoji: "👦", category: "Family 家庭" },
            { en: "sister", zh: "姊妹", emoji: "👧", category: "Family 家庭" },
            { en: "grandfather", zh: "祖父/外公", emoji: "👴", category: "Family 家庭" },
            { en: "grandmother", zh: "祖母/外婆", emoji: "👵", category: "Family 家庭" },

            // Body Parts (身體部位)
            { en: "head", zh: "頭", emoji: "👦", category: "Body Parts 身體部位" },
            { en: "eye", zh: "眼睛", emoji: "👁️", category: "Body Parts 身體部位" },
            { en: "ear", zh: "耳朵", emoji: "👂", category: "Body Parts 身體部位" },
            { en: "nose", zh: "鼻子", emoji: "👃", category: "Body Parts 身體部位" },
            { en: "mouth", zh: "嘴巴", emoji: "👄", category: "Body Parts 身體部位" },
            { en: "hand", zh: "手", emoji: "✋", category: "Body Parts 身體部位" },
            { en: "leg", zh: "腿", emoji: "🦵", category: "Body Parts 身體部位" },

            // Animals/Pets (動物)
            { en: "cat", zh: "貓", emoji: "🐱", category: "Animals 動物" },
            { en: "dog", zh: "狗", emoji: "🐶", category: "Animals 動物" },
            { en: "bird", zh: "鳥", emoji: "🐦", category: "Animals 動物" },
            { en: "fish", zh: "魚", emoji: "🐟", category: "Animals 動物" },
            { en: "rabbit", zh: "兔子", emoji: "🐰", category: "Animals 動物" },
            { en: "turtle", zh: "烏龜", emoji: "🐢", category: "Animals 動物" },

            // Food & Drinks (食物與飲品)
            { en: "apple", zh: "蘋果", emoji: "🍎", category: "Food 食物" },
            { en: "banana", zh: "香蕉", emoji: "🍌", category: "Food 食物" },
            { en: "orange", zh: "橙", emoji: "🍊", category: "Food 食物" },
            { en: "milk", zh: "牛奶", emoji: "🥛", category: "Food 食物" },
            { en: "water", zh: "水", emoji: "💧", category: "Food 食物" },
            { en: "cake", zh: "蛋糕", emoji: "🍰", category: "Food 食物" }
        ];        
        let currentIndex = 0;

        function updateDisplay() {
            const w = words[currentIndex];
            document.getElementById('word-text').innerText = w.en;
            document.getElementById('word-ipa').innerText = w.ipa;
            document.getElementById('word-emoji').innerText = w.emoji;
            document.getElementById('word-zh').innerText = w.zh;
            document.getElementById('category-tag').innerText = w.category;
            // 每次切換單詞，重置例句顯示框
            document.getElementById('example-box').innerText = "點擊綠色按鈕看例句";
            speakWord();
        }

        // 發音功能（英式發音）
        function speak(text) {
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'en-GB';
            window.speechSynthesis.speak(msg);
        }

        function speakWord() { speak(words[currentIndex].en); }

        function speakExample() {
            const example = words[currentIndex].example;
            document.getElementById('example-box').innerText = example;
            speak(example);
        }

        function nextWord() {
            currentIndex = (currentIndex + 1) % words.length;
            updateDisplay();
        }

        function prevWord() {
            currentIndex = (currentIndex - 1 + words.length) % words.length;
            updateDisplay();
        }

        window.onload = updateDisplay;
    </script>
</body>
</html>
